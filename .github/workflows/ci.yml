name: CI

on:
  push:
    branches: [dev, main, prod, staging]
  pull_request:
    branches: [dev, main, prod, staging]

jobs:
  check:
    name: Static analysis, style, rules and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql, curl, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint legacy PHP
        run: |
          set -e
          for file in $(find backend router.php -name "*.php"); do php -l "$file" > /dev/null; done

      - name: Check
        run: composer check

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        run: docker build -t archimeuble-backend:ci .
